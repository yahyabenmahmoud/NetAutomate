services:
  network-api:
    build: .
    image: ${DOCKERHUB_USER:-monuser}/network-devops:latest
    container_name: network-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - ALLOWED_TARGETS=localhost,127.0.0.1,example.com,192.168.56.0/24
    networks:
      - netdevops
    restart: unless-stopped

networks:
  netdevops:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
